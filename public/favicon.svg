<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#152e4d" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Secondary Bright Gold -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#d97706" stroke-width="2" stroke-opacity="0.4" />

  <!-- Blueprint subtle architectural grid in background -->
  <path d="M20 96 H108 M20 80 H108 M20 64 H108 M64 20 V108 M44 20 V108 M84 20 V108" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="2 3" />

  <!-- Architectural Skyscraper Skyline (Center & Flanks) -->
  <!-- Left Building -->
  <polygon points="40,50 50,42 50,88 40,88" fill="url(#goldGrad)" opacity="0.85" />
  <rect x="43" y="52" width="4" height="4" fill="#0b192c" opacity="0.6" />
  <rect x="43" y="60" width="4" height="4" fill="#0b192c" opacity="0.6" />
  <rect x="43" y="68" width="4" height="4" fill="#0b192c" opacity="0.6" />

  <!-- Center Main Skyscraper Tower (Apex) -->
  <polygon points="56,22 64,14 72,22 72,88 56,88" fill="url(#goldLight)" filter="url(#glow)" />
  <polygon points="64,14 72,22 72,88 64,88" fill="#b45309" opacity="0.35" />
  <!-- Spire -->
  <line x1="64" y1="14" x2="64" y2="8" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />

  <!-- Center Windows -->
  <rect x="60" y="28" width="8" height="3" fill="#0b192c" opacity="0.7" rx="0.5" />
  <rect x="60" y="35" width="8" height="3" fill="#0b192c" opacity="0.7" rx="0.5" />
  <rect x="60" y="42" width="8" height="3" fill="#0b192c" opacity="0.7" rx="0.5" />

  <!-- Right Building -->
  <polygon points="78,42 88,50 88,88 78,88" fill="url(#goldGrad)" opacity="0.85" />
  <rect x="81" y="52" width="4" height="4" fill="#0b192c" opacity="0.6" />
  <rect x="81" y="60" width="4" height="4" fill="#0b192c" opacity="0.6" />
  <rect x="81" y="68" width="4" height="4" fill="#0b192c" opacity="0.6" />

  <!-- Bold Modern Geometric Monogram 'M' Overlay -->
  <!-- Left Wing -->
  <polygon points="26,100 38,100 38,58 48,72 40,78 26,60" fill="url(#cyanGrad)" opacity="0.9" />
  
  <!-- Main 3D Beveled 'M' Silhouette -->
  <!-- Left Column of M -->
  <polygon points="28,98 40,98 40,54 28,62" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Left Diagonal of M -->
  <polygon points="40,54 64,82 54,82 32,58" fill="url(#goldLight)" />
  <!-- Right Diagonal of M -->
  <polygon points="64,82 88,54 96,58 74,82" fill="#b45309" />
  <!-- Right Column of M -->
  <polygon points="88,54 88,98 100,98 100,62" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Base Solid Construction Foundation Line -->
  <rect x="22" y="100" width="84" height="4" rx="2" fill="url(#goldGrad)" />
  <line x1="16" y1="106" x2="112" y2="106" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
</svg>
